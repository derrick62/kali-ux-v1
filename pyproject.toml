[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kali-ux"
version = "0.3.0a6"
description = "A modular desktop-experience enhancement suite for Kali Linux."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kali UX contributors" }]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
kali-ux = "kali_ux.cli:main"
kali-ux-swipeswitch = "kali_ux.features.window_switcher.engine.__main__:main"
kali-ux-gui = "kali_ux.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

